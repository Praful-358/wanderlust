version: "3.8"

services:
  wanderlust-app:
    build: .
    container_name: wanderlust-app
    ports:
      - "3000:3000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/wanderlust
    depends_on:
      - mongo
    restart: always

  mongo:
    image: mongo:5
    container_name: mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
